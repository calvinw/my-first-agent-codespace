<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican flying on a blue bicycle</title>
  <desc id="desc">A cheerful pelican with a big orange beak rides a blue bicycle high in the sky, bobbing along with spinning wheels above the clouds.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc9ff"/>
      <stop offset="60%" stop-color="#c6e6ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9d8a0"/>
      <stop offset="100%" stop-color="#88c47e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="100%" stop-color="#ffd84d"/>
    </radialGradient>
    <style>
      @keyframes bob {
        0%   { transform: translateY(-16px); }
        50%  { transform: translateY(16px); }
        100% { transform: translateY(-16px); }
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes drift {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-40px); }
      }
      .flyer { animation: bob 3s ease-in-out infinite; }
      .spokes { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
      .cloud { animation: drift 6s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="55" fill="url(#sun)"/>

  <!-- High clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g class="cloud">
      <ellipse cx="170" cy="120" rx="70" ry="30"/>
      <ellipse cx="220" cy="105" rx="50" ry="26"/>
      <ellipse cx="130" cy="108" rx="42" ry="22"/>
    </g>
    <g class="cloud">
      <ellipse cx="600" cy="90" rx="55" ry="24"/>
      <ellipse cx="645" cy="78" rx="40" ry="20"/>
    </g>
  </g>

  <!-- Clouds BELOW the flyer (to show height) -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="250" cy="470" rx="80" ry="28"/>
    <ellipse cx="300" cy="455" rx="55" ry="22"/>
    <ellipse cx="560" cy="490" rx="70" ry="24"/>
    <ellipse cx="510" cy="478" rx="45" ry="18"/>
  </g>

  <!-- Speed / wind lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="30" y1="250" x2="150" y2="250"/>
    <line x1="10" y1="310" x2="140" y2="310"/>
    <line x1="40" y1="370" x2="160" y2="370"/>
    <line x1="20" y1="430" x2="120" y2="430"/>
  </g>

  <!-- Ground far below -->
  <rect y="520" width="800" height="80" fill="url(#ground)"/>
  <ellipse cx="400" cy="525" rx="70" ry="12" fill="#3c7a34" opacity="0.22"/>

  <!-- ============ THE FLYING BIKE + PELICAN ============ -->
  <g class="flyer">
    <g transform="translate(0,-170)">
      <g transform="translate(0,0) scale(1)">

        <!-- ===== BIKE ===== -->
        <!-- rear wheel -->
        <circle cx="250" cy="445" r="72" fill="none" stroke="#2b2b2b" stroke-width="11"/>
        <circle cx="250" cy="445" r="60" fill="none" stroke="#cfd6da" stroke-width="4"/>
        <g class="spokes" stroke="#9aa5ad" stroke-width="2.5">
          <line x1="250" y1="385" x2="250" y2="505"/>
          <line x1="190" y1="445" x2="310" y2="445"/>
          <line x1="208" y1="403" x2="292" y2="487"/>
          <line x1="292" y1="403" x2="208" y2="487"/>
        </g>
        <circle cx="250" cy="445" r="8" fill="#4a4a4a"/>

        <!-- front wheel -->
        <circle cx="550" cy="445" r="72" fill="none" stroke="#2b2b2b" stroke-width="11"/>
        <circle cx="550" cy="445" r="60" fill="none" stroke="#cfd6da" stroke-width="4"/>
        <g class="spokes" stroke="#9aa5ad" stroke-width="2.5">
          <line x1="550" y1="385" x2="550" y2="505"/>
          <line x1="490" y1="445" x2="610" y2="445"/>
          <line x1="508" y1="403" x2="592" y2="487"/>
          <line x1="592" y1="403" x2="508" y2="487"/>
        </g>
        <circle cx="550" cy="445" r="8" fill="#4a4a4a"/>

        <!-- frame (blue) -->
        <g stroke="#2563eb" stroke-width="11" stroke-linecap="round" fill="none">
          <line x1="250" y1="445" x2="400" y2="455"/>
          <line x1="400" y1="455" x2="358" y2="300"/>
          <line x1="358" y1="300" x2="250" y2="445"/>
          <line x1="400" y1="455" x2="545" y2="322"/>
          <line x1="545" y1="322" x2="550" y2="445"/>
          <line x1="358" y1="300" x2="545" y2="322"/>
        </g>

        <!-- chain + chainring -->
        <g fill="none" stroke="#3a3a3a">
          <circle cx="400" cy="455" r="21" stroke-width="6"/>
          <line x1="382" y1="472" x2="250" y2="452" stroke-width="4"/>
          <line x1="418" y1="438" x2="250" y2="438" stroke-width="4"/>
        </g>

        <!-- seat -->
        <ellipse cx="352" cy="295" rx="34" ry="11" fill="#2b2b2b"/>

        <!-- handlebar -->
        <path d="M545 322 C545 292 552 284 578 284" fill="none" stroke="#2b2b2b" stroke-width="10" stroke-linecap="round"/>
        <circle cx="582" cy="284" r="9" fill="#1c1c1c"/>

        <!-- cranks + pedals -->
        <g stroke="#3a3a3a" stroke-width="8" stroke-linecap="round">
          <line x1="400" y1="455" x2="420" y2="428"/>
          <line x1="400" y1="455" x2="382" y2="480"/>
        </g>
        <ellipse cx="420" cy="428" rx="16" ry="7" fill="#2b2b2b"/>
        <ellipse cx="382" cy="480" rx="16" ry="7" fill="#2b2b2b"/>

        <!-- ===== PELICAN ===== -->
        <path d="M288 212 L232 190 L252 244 Z" fill="#e9e6da" stroke="#cdc9ba" stroke-width="3"/>

        <g stroke="#e8862b" stroke-width="12" stroke-linecap="round" fill="none">
          <path d="M372 282 L384 382 L383 476"/>
          <path d="M394 286 L412 376 L419 428"/>
        </g>

        <ellipse cx="350" cy="230" rx="84" ry="58" fill="#f6f4ea" stroke="#d9d5c6" stroke-width="3" transform="rotate(-8 350 230)"/>
        <path d="M406 196 C446 162 472 148 502 146 L504 192 C472 196 442 220 418 248 Z" fill="#f6f4ea" stroke="#d9d5c6" stroke-width="3"/>
        <circle cx="505" cy="148" r="36" fill="#f6f4ea" stroke="#d9d5c6" stroke-width="3"/>

        <!-- beak -->
        <path d="M536 128 L668 158 L536 166 Z" fill="#f5a623" stroke="#d98a12" stroke-width="3" stroke-linejoin="round"/>
        <path d="M538 164 Q616 214 663 160 Q596 182 541 172 Z" fill="#f9c65c" stroke="#e0a52c" stroke-width="3" stroke-linejoin="round"/>
        <line x1="536" y1="160" x2="660" y2="159" stroke="#d98a12" stroke-width="3"/>

        <!-- eye -->
        <circle cx="512" cy="138" r="7" fill="#232323"/>
        <circle cx="509.5" cy="135.5" r="2.4" fill="#ffffff"/>

        <!-- wing holding the handlebar -->
        <path d="M400 200 Q466 200 548 292 L566 278 Q482 190 408 178 Z" fill="#e9e6da" stroke="#cdc9ba" stroke-width="3" stroke-linejoin="round"/>
        <path d="M432 200 Q480 226 540 288" fill="none" stroke="#cdc9ba" stroke-width="3" stroke-linecap="round"/>
        <path d="M448 214 Q494 240 548 290" fill="none" stroke="#cdc9ba" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
